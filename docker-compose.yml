services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      SOCKET_PORT: 3001
    ports:
      - '3000:3000'
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in your local environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in your local environment}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your local environment}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping --host=127.0.0.1 --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
