services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SOCKET_PORT: 3001
    ports:
      - '3000:3000'
      - '3001:3001'
    restart: unless-stopped

  mysql:
    profiles:
      - demo-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockroom
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-demo-root}
      MYSQL_USER: ${MYSQL_USER:-stockroom_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-demo-app}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping --host=127.0.0.1 --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
